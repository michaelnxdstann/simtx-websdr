<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0–30 MHz Receiver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0f1c;--hdr:64px;--panel:#424a4f;--panel2:#2f3539;--ink:#dfe5e8;--mute:#9aa6ad;--blue:#79b8ff;--orange:#f5a623;--green:#19e619;--red:#ff4a5a;--btn:#2b3135;--ruler:#17191c;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Chivo',system-ui,sans-serif;overflow:hidden}
#hdr{position:fixed;left:0;top:0;width:100%;height:var(--hdr);background:#1b1f23;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #000;z-index:5}
#hdr .logo{font-size:34px;line-height:1}
#hdr .nm{font:700 17px 'Chivo',sans-serif;color:#e4e9ec}
#hdr .sub{font-size:12px;color:var(--mute);line-height:1.35}
#hdr .info{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hdr .who{margin-left:auto;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
#hdr .who input{background:#2c3135;color:#fff;border:1px solid #3a4146;border-radius:3px;font:600 12px 'Chivo',sans-serif;padding:3px 6px;width:170px}
@media(max-width:700px){#hdr .who{display:none}}
#ruler{position:fixed;left:0;top:var(--hdr);width:100%;height:26px;background:var(--ruler);display:block}
#wf{position:fixed;left:0;top:calc(var(--hdr) + 26px);width:100%;height:calc(100% - var(--hdr) - 26px);display:block;cursor:crosshair}
#band{position:fixed;top:calc(var(--hdr) + 26px);bottom:0;background:rgba(255,255,255,.13);border-top:4px solid #a86b00;pointer-events:none}
#line{position:fixed;top:var(--hdr);bottom:0;width:2px;background:#f22;pointer-events:none}
#panel{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:376px;max-width:calc(100% - 24px);background:var(--panel);border-radius:14px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#freq{width:86px;background:#16181a;color:#fff;border:0;border-radius:3px;font:600 17px 'Chivo',sans-serif;padding:3px 5px}
#freq:focus{outline:2px solid var(--blue)}
select{background:#1d2023;color:var(--red);border:1px solid #555;border-radius:3px;font:400 12px 'Chivo',sans-serif;padding:3px 4px}
select#band-sel{width:96px}select#ext{width:112px}
.ico{width:30px;height:30px;border-radius:50%;border:2px solid #cfd6da;background:transparent;color:#cfd6da;font:700 15px/1 'Chivo',sans-serif;cursor:pointer;padding:0}
#play{width:26px;height:26px;border-color:#dfe5e8}
#play.on{background:var(--green);border-color:var(--green);color:#052}
.step{width:20px;height:20px;border-radius:50%;border:2px solid #cfd6da;background:none;color:#cfd6da;font:700 12px/1 'Chivo',sans-serif;cursor:pointer;padding:0}
.step:hover,.ico:hover{border-color:var(--blue);color:var(--blue)}
.chip{background:var(--btn);color:#dfe5e8;border:0;border-radius:4px;font:700 12px 'Chivo',sans-serif;padding:5px 8px;cursor:pointer}
.chip.on{color:var(--green)}
.chip:focus-visible,.ico:focus-visible,.step:focus-visible,.tab:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.modes{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tools{display:flex;gap:6px;margin-bottom:6px}
.tool{flex:1;height:42px;background:#363d41;border:0;border-radius:5px;color:var(--orange);font-size:20px;cursor:pointer}
.tool:hover{background:#40484d}
.tabs{display:flex;justify-content:space-between;margin-bottom:8px}
.tab{background:none;border:0;color:var(--blue);font:400 13px 'Chivo',sans-serif;padding:4px 6px;cursor:pointer;border-radius:3px}
.tab.on{background:#31383c;color:#b9d8ff;font-weight:600}
.pane{height:118px;overflow:auto;font-size:12px;line-height:1.5;background:#3b4347;border-radius:4px;padding:6px 8px}
.pane label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 0}
.pane input[type=range]{width:200px}
.rx{display:flex;gap:8px}.rx b{width:28px;color:var(--orange);font-weight:600}.rx.me b{color:var(--green)}
.rx a{color:var(--blue)}.t{color:var(--orange)}
#sm{position:relative;margin-top:8px;background:#222629;border-radius:4px;padding:2px 8px 4px}
#sm .lab{display:flex;position:relative;height:13px;font-size:10px;font-weight:600;color:#cfd6da}
#sm .lab span{position:absolute;transform:translateX(-50%)}
#bar{height:7px;background:#111;position:relative}
#bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);width:0}
#dbm{position:absolute;right:8px;top:3px;font-size:11px;color:#cfd6da}
#panel.off .body{display:none}
#tip{position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mute);background:rgba(10,15,28,.7);padding:6px 10px;border-radius:6px}
@media(max-width:520px){#tip{display:none}}
</style>
</head>
<body>
<header id="hdr"><div class="logo" aria-hidden="true">📻</div>
<div class="info"><div class="nm" id="rxName"></div><div class="sub" id="rxLoc"></div><div class="sub" id="rxAnt"></div></div>
<label class="who">Your name or callsign:<input id="who" maxlength="16" spellcheck="false" autocomplete="off"></label></header>
<canvas id="ruler"></canvas>
<canvas id="wf"></canvas>
<div id="band"></div><div id="line"></div>
<div id="tip">Click the waterfall to tune · scroll to fine tune · press ▶ for audio (simulated band)</div>

<section id="panel" aria-label="Receiver controls">
  <div class="body">
  <div class="row">
    <input id="freq" value="4612.00" inputmode="decimal" aria-label="Frequency in kHz">
    <select id="band-sel" aria-label="Select band"><option value="">select band</option></select>
    <select id="ext" aria-label="Extension"><option>extension</option><option>S-meter</option><option>Waterfall</option><option>Noise filter</option></select>
    <button class="ico" id="play" aria-label="Start audio">▶</button>
  </div>
  <div class="row" style="gap:6px">
    <button class="chip" id="autoBtn" style="border-radius:50%;background:#14c4c4;color:#fff;width:22px;height:22px;padding:0" title="Auto-scroll">A</button>
    <button class="chip" id="mute" style="width:22px;height:22px;padding:0;color:var(--green)" title="Mute">9</button>
    <button class="step" data-s="-100">−</button><button class="step" data-s="-10">−</button><button class="step" data-s="-1">−</button>
    <button class="step" data-s="1">+</button><button class="step" data-s="10">+</button><button class="step" data-s="100">+</button>
    <button class="chip" id="spec" style="margin-left:auto">Spec</button>
    <button class="ico" id="reset" style="width:24px;height:24px;border:0;color:#ff4d79;font-size:18px" title="Reset" aria-label="Reset view">↻</button>
  </div>
  <div class="modes" id="modes">
    <button class="chip" data-m="am">AM</button><button class="chip" data-m="sam">SAM</button><button class="chip" data-m="drm">DRM</button><button class="chip" data-m="lsb">LSB</button><button class="chip on" data-m="usb">USB</button><button class="chip" data-m="cw">CW</button><button class="chip" data-m="nbfm">NBFM</button><button class="chip" data-m="iq">IQ</button>
  </div>
  <div class="tools">
    <button class="tool" id="zin" aria-label="Zoom in">⊕</button>
    <button class="tool" id="zout" aria-label="Zoom out">⊖</button>
    <button class="tool" id="zmax" aria-label="Zoom to passband">⤡</button>
    <button class="tool" id="zall" aria-label="Full 0–30 MHz">⤢</button>
    <button class="tool" id="tl" aria-label="Tune down" style="color:#cfd6da">‹</button>
    <button class="tool" id="tr" aria-label="Tune up" style="color:#cfd6da">›</button>
  </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-p="rf">RF</button><button class="tab" data-p="wf">WF</button><button class="tab" data-p="aud">AUD</button><button class="tab" data-p="agc">AGC</button><button class="tab on" data-p="user">User</button><button class="tab" data-p="stat">Stat</button><button class="tab" data-p="off">Off</button>
  </div>
  <div class="body">
    <div class="pane" id="pane"></div>
    <div id="sm">
      <div class="lab" id="lab"></div>
      <div id="bar"><i id="barfill"></i></div>
      <div id="dbm">-92 dBm</div>
    </div>
  </div>
</section>

<script>
/* Built-in defaults. config.json (same folder) overrides them; server.json holds the current tunnel link. */
const DEFAULTS={"title":"0–30 MHz Receiver","receiver":{"name":"SimTX SDR","location":"Budapest, Hungary","antenna":"EFHW 49:1"},"maxKHz":30000,"startFreqKHz":4612,"startMode":"usb","volume":0.7,"agc":true,"wfMinDb":-125,"wfMaxDb":-65,"wfIntervalMs":45,"colormap":["#000000", "#0000FF", "#00FFFF", "#00FF00", "#FFFF00", "#FF0000", "#FF00FF", "#FFFFFF"],"user":{"name":"mike","sessionSeconds":1800},"passbands":{"am":[-4.5,4.5],"sam":[-4.5,4.5],"drm":[-5,5],"lsb":[-2.7,0],"usb":[0,2.7],"cw":[-0.25,0.25],"nbfm":[-6,6],"iq":[-5,5]},"bands":[["LW 153–279",216],["MW 531–1602",1000],["120m 2300–2495",2400],["90m 3200–3400",3300],["75m 3900–4000",3950],["60m 4750–5060",4900],["49m 5900–6200",6000],["40m 7000–7200",7100],["31m 9400–9900",9600],["25m 11600–12100",11800],["20m 14000–14350",14100],["19m 15100–15800",15400],["17m 18068–18168",18100],["15m 21000–21450",21100],["13m 21450–21850",21600],["10m 28000–29700",28300]],"seed":7,"randomStations":90,"stations":[{"f":4609.7,"p":-62,"t":"c"},{"f":4612,"p":-62,"t":"c"},{"f":4614.2,"p":-62,"t":"c"},{"f":4635.5,"p":-70,"t":"d"}],"source":{"type":"rtltcp","host":"193.24.208.6","port":1240,"wsUrl":"auto","wsPath":"/rtl","sampleRate":250000,"directSampling":2,"upconverterKHz":0,"ppm":0,"fftSize":4096,"dbOffset":-40}};
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const merge=(a,b)=>{const o={...a};for(const k in b)o[k]=isObj(a[k])&&isObj(b[k])?merge(a[k],b[k]):b[k];return o};
async function linkBase(){ /* ?server=… in the address > server.json > the server that served this page (bridge) */
 const q=new URLSearchParams(location.search).get('server');if(q&&/^https?:\/\/[^\s/]+/i.test(q))return q.trim().replace(/\/+$/,'');
 try{const r=await fetch('server.json?_='+Date.now(),{cache:'no-store'});
  if(r.ok){const j=await r.json(),u=String(j.url||'').trim().replace(/\/+$/,'');if(/^https?:\/\/[^\s/]+/i.test(u)&&!/YOUR-TUNNEL/i.test(u))return u}}catch(e){}
 return /^https?:$/.test(location.protocol)?location.origin:'http://localhost:8080'} /* opened from disk (file://): use the local bridge */
function boot(){
const C=window.RX_CONFIG;document.title=C.title;
const $=id=>document.getElementById(id);
const MAXK=C.maxKHz, wf=$('wf'), ctx=wf.getContext('2d',{willReadFrequently:false}), rul=$('ruler'), rctx=rul.getContext('2d');
const S={f:C.startFreqKHz,mode:C.startMode,z:0,cf:C.maxKHz/2,vol:C.volume,min:C.wfMinDb,max:C.wfMaxDb,rf:0,agc:C.agc,audio:false,muted:false,auto:true,sig:-120};
const SRC=C.source||{},LIVE=SRC.type==='rtltcp',SR=SRC.sampleRate||250000,FULL=LIVE?SR/1000:MAXK;
let hc=LIVE?Math.max(FULL/2,Math.min(MAXK-FULL/2,C.startFreqKHz+FULL/4)):MAXK/2; /* hardware centre (kHz) */
const BW=C.passbands;
const BANDS=C.bands;
BANDS.forEach(b=>{const o=document.createElement('option');o.value=b[1];o.textContent=b[0];$('band-sel').appendChild(o)});

/* simulated band: seeded stations */
let seed=C.seed;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const ST=C.stations.map(x=>({...x}));
for(let i=0;i<C.randomStations;i++){const f=150+rnd()*(C.maxKHz-200);ST.push({f,p:-100+rnd()*46,t:rnd()<.25?'c':'a',ph:rnd()*6})}
ST.sort((a,b)=>a.f-b.f);

function view(){const span=FULL/Math.pow(2,S.z),b=hc-FULL/2;let s=(S.z?S.cf:hc)-span/2;s=Math.max(b,Math.min(b+FULL-span,s));return{s,span}}
function level(f,t,span){ if(LIVE)return specAt(f,span); /* dB at freq f (kHz) */
  let lin=Math.pow(10,(-117+11*Math.exp(-f/5000)+(Math.random()-.5)*5)/10);
  const w=Math.max(span/1500,.4);
  for(const s of ST){const d=f-s.f;if(d<-8||d>8)continue;
    const fade=.75+.25*Math.sin(t/900+(s.ph||0));
    let p;
    if(s.t==='c')p=s.p-Math.min(60,Math.abs(d)*14/w*.15);
    else if(s.t==='d')p=Math.abs(d)<5?s.p-6+Math.random()*10:-200;
    else{const a=Math.abs(d);p=a<.35?s.p:(a<4.6?s.p-18-Math.random()*7:s.p-55)}
    lin+=Math.pow(10,(p+10*Math.log10(fade)-S.rf)/10)}
  return 10*Math.log10(lin)}

/* colormap */
const LUT=new Uint8ClampedArray(256*3);
(function(){const st=C.colormap.map((c,i,a)=>typeof c==='string'?[i/(a.length-1),parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]:c);
for(let i=0;i<256;i++){const v=i/255;let k=0;while(k<st.length-2&&v>st[k+1][0])k++;
const a=st[k],b=st[k+1],u=(v-a[0])/(b[0]-a[0]);for(let c=0;c<3;c++)LUT[i*3+c]=a[c+1]+(b[c+1]-a[c+1])*Math.max(0,Math.min(1,u))}})();

let W=0,H=0;
function resize(){const dpr=1;W=wf.width=innerWidth;H=wf.height=innerHeight-HDR-26;rul.width=innerWidth;rul.height=26;ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);drawRuler();place()}
function fmt(k){return k>=1000?(k/1000).toFixed(k%1000===0?0:3):k}
function drawRuler(){const{s,span}=view();rctx.fillStyle='#17191c';rctx.fillRect(0,0,rul.width,26);
 rctx.font='600 12px Chivo,sans-serif';rctx.textAlign='center';rctx.fillStyle='#c8cfd3';rctx.strokeStyle='#777';
 const steps=[1,2,5,10,20,50,100,200,500,1000,2000,5000];let st=steps.find(x=>x>=span/8)||5000;
 const first=Math.ceil(s/st)*st;
 for(let f=first;f<=s+span;f+=st){const x=(f-s)/span*W;rctx.beginPath();rctx.moveTo(x,18);rctx.lineTo(x,26);rctx.stroke();
  rctx.fillText(Math.round(f).toLocaleString('fr-FR'),x,13)}}
function x_of(f){const{s,span}=view();return(f-s)/span*W}
function place(){const[a,b]=BW[S.mode];let x1=x_of(S.f+a),x2=x_of(S.f+b);if(x2-x1<3){const m=(x1+x2)/2;x1=m-1.5;x2=m+1.5}
 const bd=$('band').style;bd.left=x1+'px';bd.width=(x2-x1)+'px';$('line').style.left=(x_of(S.f)-1)+'px'}

function setF(f,keep){S.f=Math.max(1,Math.min(MAXK-1,f));retune();$('freq').value=S.f.toFixed(2);
 const{s,span}=view();if(S.z>0&&(S.f<s+span*.05||S.f>s+span*.95)||S.auto&&S.z>0&&!keep)S.cf=S.f;
 drawRuler();place();userList();audioUpdate()}

/* waterfall loop */
let last=0,vkey='';
function frame(t){requestAnimationFrame(frame);
 if(t-last<C.wfIntervalMs)return;last=t;
 if(LIVE&&!computeSpec())return;
 const{s,span}=view();const k=s+'|'+span+'|'+W;if(k!==vkey){vkey=k;ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);drawRuler();place()}
 ctx.drawImage(wf,0,0,W,H-1,0,1,W,H-1);
 const row=ctx.createImageData(W,1),d=row.data,rg=S.max-S.min;
 for(let x=0;x<W;x++){const f=s+(x+.5)/W*span;let v=(level(f,t,span)-S.min)/rg;v=Math.max(0,Math.min(1,v));const i=(v*255)|0;
  d[x*4]=LUT[i*3];d[x*4+1]=LUT[i*3+1];d[x*4+2]=LUT[i*3+2];d[x*4+3]=255}
 ctx.putImageData(row,0,0);
 meter(t)}

/* S-meter */
const MARKS=[['S1',-121],['S3',-109],['S5',-97],['S7',-85],['S9',-73],['+10',-63],['+20',-53],['+40',-33],['+60',-13]];
const pos=d=>Math.max(0,Math.min(100,(d+127)/117*100));
MARKS.forEach(m=>{const s=document.createElement('span');s.textContent=m[0];s.style.left=pos(m[1])+'%';$('lab').appendChild(s)});
function meter(t){const[a,b]=BW[S.mode];let sum=0,n=0;for(let i=0;i<5;i++){sum+=Math.pow(10,level(S.f+a+(b-a)*i/4,t,1)/10);n++}
 const raw=LIVE?bandPower(S.f+a,S.f+b):10*Math.log10(sum/n);S.sig+=(raw-S.sig)*.35;
 $('barfill').style.width=pos(S.sig)+'%';$('dbm').textContent=Math.round(S.sig)+' dBm'}

/* user/panes */
const t0=Date.now();
function hms(s){return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function userList(){if(S.pane!=='user')return;const el=(Date.now()-t0)/1000|0,left=C.user.sessionSeconds-el%C.user.sessionSeconds;
 let h=`<div class="rx me"><b>RX0</b><span>"${USER}"</span></div><div class="rx" style="margin-left:36px"><a href="#">${S.f.toFixed(2)} kHz ${S.mode} z${S.z}</a> <span>${hms(el)}</span> <span class="t">${hms(left)} act</span></div>`;
 for(let i=1;i<8;i++)h+=`<div class="rx"><b>RX${i}</b></div>`;$('pane').innerHTML=h}
function pane(p){S.pane=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 $('panel').classList.toggle('off',p==='off');const el=$('pane');
 if(p==='user')return userList();
 const sl=(l,id,mn,mx,v,st)=>`<label>${l}<input type="range" id="${id}" min="${mn}" max="${mx}" step="${st||1}" value="${v}"></label>`;
 if(p==='rf')el.innerHTML=sl('Attenuation (dB)','rfA',0,40,S.rf);
 else if(p==='wf')el.innerHTML=sl('Min dB','wMin',-150,-90,S.min)+sl('Max dB','wMax',-80,-20,S.max);
 else if(p==='aud')el.innerHTML=sl('Volume','vol',0,100,S.vol*100);
 else if(p==='agc')el.innerHTML=`<label>AGC on <input type="checkbox" id="agcC" ${S.agc?'checked':''}></label><div style="color:var(--mute)">Keeps audio level steady on fading signals.</div>`;
 else if(p==='stat')el.innerHTML=`Passband: ${BW[S.mode][0]} to ${BW[S.mode][1]} kHz<br>Span: ${(view().span/1000).toFixed(3)} MHz<br>Range: 0–30 MHz<br>Audio: ${ac?ac.state:'off'}<br>Source: ${LIVE?'RTL-TCP ('+STATUS+')':'simulated band'}`;
 const g=id=>$(id);
 g('rfA')&&(g('rfA').oninput=e=>S.rf=+e.target.value);
 g('wMin')&&(g('wMin').oninput=e=>S.min=+e.target.value);g('wMax')&&(g('wMax').oninput=e=>S.max=+e.target.value);
 g('vol')&&(g('vol').oninput=e=>{S.vol=e.target.value/100;audioUpdate()});
 g('agcC')&&(g('agcC').onchange=e=>S.agc=e.target.checked)}
setInterval(userList,1000);

/* audio */
let ac,nodes;
function startAudio(){ac=new (window.AudioContext||window.webkitAudioContext)();if(LIVE){startLive();return}
 const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
 const hp=ac.createBiquadFilter(),lp=ac.createBiquadFilter();hp.type='highpass';lp.type='lowpass';
 const ng=ac.createGain(),osc=ac.createOscillator(),og=ac.createGain(),mg=ac.createGain();
 osc.type='sine';osc.start();src.start();
 src.connect(hp);hp.connect(lp);lp.connect(ng);ng.connect(mg);osc.connect(og);og.connect(mg);mg.connect(ac.destination);
 nodes={hp,lp,ng,osc,og,mg};audioUpdate()}
function audioUpdate(){if(!nodes)return;if(LIVE){dspSetup();nodes.mg.gain.setTargetAtTime(S.muted?0:S.vol,ac.currentTime,.03);return}const m=S.mode,[a,b]=BW[m],T=ac.currentTime;
 const bw=(b-a)*1000;nodes.hp.frequency.setTargetAtTime(m==='cw'?500:300,T,.02);nodes.lp.frequency.setTargetAtTime(Math.min(m==='cw'?900:Math.max(bw,600),5000),T,.02);
 let pitch=0,amp=0;
 for(const s of ST){const d=s.f-S.f;if(d<a-.3||d>b+.3)continue;
  const lv=s.p+(S.agc?0:-S.rf),g=Math.max(0,Math.min(1,(lv+110)/50));
  if(m==='usb'||m==='lsb')pitch=Math.abs(d)*1000||300;else if(m==='cw')pitch=700+d*1000;else pitch=440;
  if(g>amp)amp=g}
 nodes.osc.frequency.setTargetAtTime(Math.max(50,pitch||440),T,.02);
 nodes.og.gain.setTargetAtTime(amp*.5,T,.05);
 const nz=Math.max(.02,Math.min(.35,(S.sig+125)/180))*(S.agc?.8:1);nodes.ng.gain.setTargetAtTime(nz*.5,T,.05);
 nodes.mg.gain.setTargetAtTime(S.muted?0:S.vol,T,.03)}
setInterval(audioUpdate,300);
function setPlay(on,user){
 if(on){if(!ac)startAudio();else ac.resume();S.audio=true}
 else{if(ac)ac.suspend();S.audio=false}
 if(user)S.userPaused=!on;
 $('play').classList.toggle('on',S.audio);$('play').textContent=S.audio?'■':'▶'}
$('play').onclick=()=>setPlay(!S.audio,true);
/* browsers only allow sound after a click/key press: auto-start tries on connect, the first interaction unlocks it */
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>{if(S.audio&&ac&&ac.state==='suspended')ac.resume()},{passive:true}));
$('mute').onclick=()=>{S.muted=!S.muted;$('mute').style.color=S.muted?'#f66':'var(--green)';audioUpdate()};

/* ===== RTL-TCP live source (via bridge.js WebSocket) ===== */
const N=SRC.fftSize||4096,OFS=SRC.dbOffset??-40;
const rRe=new Float32Array(N),rIm=new Float32Array(N),SP=new Float32Array(N).fill(-150);
const win=new Float32Array(N),fr=new Float32Array(N),fi=new Float32Array(N),cosT=new Float32Array(N/2),sinT=new Float32Array(N/2);
let rp=0,have=false,STATUS='simulated',wsum=0,ws=null,got=false,carry=-1,dsp=null;
for(let i=0;i<N;i++){win[i]=.5-.5*Math.cos(2*Math.PI*i/N);wsum+=win[i]}
for(let i=0;i<N/2;i++){cosT[i]=Math.cos(2*Math.PI*i/N);sinT[i]=-Math.sin(2*Math.PI*i/N)}
function fft(re,im){
 for(let i=1,j=0;i<N;i++){let bit=N>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
 for(let len=2;len<=N;len<<=1){const h=len>>1,st=N/len;
  for(let i=0;i<N;i+=len)for(let k=0;k<h;k++){const wr=cosT[k*st],wi=sinT[k*st],a=i+k,b=a+h,xr=re[b]*wr-im[b]*wi,xi=re[b]*wi+im[b]*wr;re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi}}}
function computeSpec(){if(!have)return false;
 for(let i=0;i<N;i++){const k=(rp+i)&(N-1);fr[i]=rRe[k]*win[i];fi[i]=rIm[k]*win[i]}
 fft(fr,fi);
 for(let i=0;i<N;i++){const j=(i+N/2)&(N-1),d=10*Math.log10((fr[j]*fr[j]+fi[j]*fi[j])/(wsum*wsum)+1e-20)+OFS;SP[i]+=(d-SP[i])*.6}
 return true}
const binOf=f=>Math.round(((f-hc)/FULL+.5)*N);
function specAt(f,span){const i=binOf(f);if(i<0||i>=N)return -150;const w=Math.round((span/W)/(FULL/N)/2);let m=-200;
 for(let k=Math.max(0,i-w);k<=Math.min(N-1,i+w);k++)if(SP[k]>m)m=SP[k];return m}
function bandPower(f1,f2){let a=Math.max(0,binOf(f1)),b=Math.min(N-1,binOf(f2));if(b<a)b=a;let p=0;for(let k=a;k<=b;k++)p+=Math.pow(10,SP[k]/10);return 10*Math.log10(p+1e-20)}

function cmd(c,v){if(ws&&ws.readyState===1){const d=new DataView(new ArrayBuffer(5));d.setUint8(0,c);d.setUint32(1,v>>>0,false);ws.send(d.buffer)}}
function hwTune(){cmd(1,Math.round((hc+(SRC.upconverterKHz||0))*1000))}
function setStatus(t){STATUS=t;$('tip').textContent='RTL-TCP · '+t}
async function connect(){
 setStatus('reading server.json…');got=false;carry=-1;
 let url=SRC.wsUrl&&SRC.wsUrl!=='auto'?SRC.wsUrl:'';
 if(!url){const base=await linkBase();
  if(!base){setStatus('no server link: put your tunnel URL in server.json');setTimeout(connect,10000);return}
  try{await fetch(base+'/config.json?_='+Date.now(),{cache:'no-store'})}
  catch(e){setStatus('tunnel not reachable: is node bridge.js running? is server.json the newest link?');setTimeout(connect,8000);return}
  url=base.replace(/^http/i,'ws')+(SRC.wsPath||'/rtl')}
 setStatus('connecting…');LASTERR='';
 try{ws=new WebSocket(url)}catch(e){setStatus('bad WebSocket URL');setTimeout(connect,10000);return}
 ws.binaryType='arraybuffer';
 ws.onopen=()=>{setStatus('connected');cmd(2,SR);cmd(9,SRC.directSampling??2);cmd(3,0);cmd(8,1);cmd(5,SRC.ppm||0);hwTune();if(C.autoAudio!==false&&!S.userPaused)setPlay(true)};
 ws.onmessage=e=>{if(typeof e.data==='string'){try{const m=JSON.parse(e.data);if(m.error){LASTERR=m.error;setStatus('bridge says: '+m.error)}}catch(_){}return}let u=new Uint8Array(e.data);if(!got){got=true;if(u.length>=12&&u[0]===82&&u[1]===84&&u[2]===76&&u[3]===48)u=u.subarray(12)}BYTES+=u.length;onIQ(u)};
 ws.onclose=()=>{setStatus('disconnected'+(LASTERR?' ('+LASTERR+')':'')+', retrying…');setTimeout(connect,LASTERR?6000:3000)};
 ws.onerror=()=>ws.close()}
function retune(){if(!LIVE)return;
 if(S.f<hc-FULL/2*.85||S.f>hc+FULL/2*.85){hc=Math.max(FULL/2,Math.min(MAXK-FULL/2,S.f+FULL/4));hwTune();S.cf=S.f;SP.fill(-150)}}

/* DSP: NCO mix -> boxcar decimate -> passband mix -> FIR -> demod -> AGC -> ring */
const AM=65535,aR=new Float32Array(65536);let wp=0,rpA=0;
function onIQ(u){let i=0,n=u.length;if(carry>=0&&n){iq(carry,u[0]);carry=-1;i=1}
 for(;i+1<n;i+=2)iq(u[i],u[i+1]);if(i<n)carry=u[i];have=true}
function iq(b0,b1){const re=(b0-127.5)/127.5,im=(b1-127.5)/127.5;
 rRe[rp]=re;rIm[rp]=im;rp=(rp+1)&(N-1);
 const D=dsp;if(!D)return;
 D.acR+=re*D.c+im*D.s;D.acI+=im*D.c-re*D.s;
 const c=D.c*D.wc-D.s*D.ws;D.s=D.c*D.ws+D.s*D.wc;D.c=c;
 if(++D.k>=8192){D.k=0;const m=Math.hypot(D.c,D.s);D.c/=m;D.s/=m}
 if(++D.n<D.D)return;D.n=0;const yr=D.acR/D.D,yi=D.acI/D.D;D.acR=D.acI=0;stage(D,yr,yi)}
function stage(D,yr,yi){
 D.p2=(D.p2+D.w2)%6.283185307;const c2=Math.cos(D.p2),s2=Math.sin(D.p2);
 const L=D.L;let fp=D.fp;D.fR[fp]=yr*c2+yi*s2;D.fI[fp]=yi*c2-yr*s2;
 let oR=0,oI=0;for(let k=0,j=fp;k<L;k++){oR+=D.h[k]*D.fR[j];oI+=D.h[k]*D.fI[j];if(--j<0)j=L-1}
 D.fp=(fp+1)%L;
 let d;const m=D.m;
 if(m==='usb'||m==='lsb')d=oR*c2-oI*s2;
 else if(m==='cw'){D.p3=(D.p3+D.w3)%6.283185307;d=oR*Math.cos(D.p3)-oI*Math.sin(D.p3)}
 else if(m==='nbfm'){d=Math.atan2(oI*D.pr-oR*D.pq,oR*D.pr+oI*D.pq)/Math.PI*2;D.pr=oR;D.pq=oI}
 else if(m==='iq')d=oR;
 else{d=Math.hypot(oR,oI);D.dc+=(d-D.dc)*.002;d-=D.dc}
 const a=Math.abs(d);D.env+=(a-D.env)*(a>D.env?.02:.0003);
 const g=S.agc?.3/Math.max(D.env,.003):30;
 aR[wp++&AM]=Math.max(-1,Math.min(1,d*g))}
function dspSetup(){if(!LIVE||!nodes)return;
 const m=S.mode,[lo,hi]=BW[m],pc=(lo+hi)/2*1000,hb=(hi-lo)/2*1000,Dn=Math.max(1,Math.round(SR/32000)),rate=SR/Dn,off=(S.f-hc)*1000;
 const key=[m,off,SR].join();if(dsp&&dsp.key===key)return;
 let L=Math.round(rate/hb*1.6)|1;L=Math.max(31,Math.min(255,L))|1;
 const h=new Float32Array(L),mid=(L-1)/2,fc=hb/rate;let sum=0;
 for(let k=0;k<L;k++){const x=k-mid,sc=x===0?2*fc:Math.sin(2*Math.PI*fc*x)/(Math.PI*x);h[k]=sc*(.54-.46*Math.cos(2*Math.PI*k/(L-1)));sum+=h[k]}
 for(let k=0;k<L;k++)h[k]/=sum;
 const w=2*Math.PI*off/SR,o=dsp;
 dsp={key,m,D:Dn,rate,h,L,fR:new Float32Array(L),fI:new Float32Array(L),fp:0,c:o?o.c:1,s:o?o.s:0,wc:Math.cos(w),ws:Math.sin(w),
  n:0,k:0,acR:0,acI:0,p2:0,w2:2*Math.PI*pc/rate,p3:0,w3:2*Math.PI*700/rate,pr:1,pq:0,dc:0,env:.05}}
function startLive(){
 ac.resume();
 const sp=ac.createScriptProcessor(2048,1,1),mg=ac.createGain();
 sp.onaudioprocess=e=>{const out=e.outputBuffer.getChannelData(0),rate=dsp?dsp.rate:32000,st=rate/ac.sampleRate;
  if(wp-rpA>rate*.5)rpA=wp-rate*.1;
  for(let i=0;i<out.length;i++){if(wp-rpA<2){out[i]=0;continue}const k=Math.floor(rpA),f=rpA-k;out[i]=aR[k&AM]*(1-f)+aR[(k+1)&AM]*f;rpA+=st}};
 sp.connect(mg);mg.connect(ac.destination);nodes={mg,sp};dspSetup();audioUpdate()}

/* receiver info, wheel zoom, arrow keys */
const HDR=64,R=C.receiver||{};let USER=C.user.name,BYTES=0,lastB=0,LASTERR='';
$('rxName').textContent=R.name||'';$('rxLoc').textContent=R.location||'';$('rxAnt').textContent=R.antenna?'Antenna: '+R.antenna:'';
if(R.name)document.title=R.name;
$('who').value=USER.toUpperCase();$('who').oninput=e=>{USER=e.target.value||'anon';userList()};
wf.addEventListener('wheel',e=>{e.preventDefault();const fc=fAt(e.clientX),nz=Math.max(0,Math.min(10,S.z+(e.deltaY<0?1:-1)));if(nz===S.z)return;
 S.z=nz;const span=FULL/Math.pow(2,nz);S.cf=fc-(e.clientX/W)*span+span/2;drawRuler();place();userList()},{passive:false});
addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
 const k={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key];if(!k)return;e.preventDefault();
 setF(Math.round((S.f+k*(e.shiftKey?1:.1))*100)/100,true)});
setInterval(()=>{if(!LIVE||STATUS!=='connected')return;const kb=Math.round((BYTES-lastB)/1024);lastB=BYTES;
 $('tip').textContent='RTL-TCP · connected · '+(kb?kb+' kB/s':'no data from rtl_tcp yet')+' · '+(ac&&ac.state==='suspended'&&S.audio?'audio waiting: click the page':'audio '+(ac?ac.state:'off'))},1000);

/* interactions */
function fAt(x){const{s,span}=view();return s+x/W*span}
wf.addEventListener('click',e=>setF(Math.round(fAt(e.clientX)*10)/10,true));

$('freq').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=parseFloat($('freq').value.replace(',','.'));if(v>0&&v<MAXK){S.cf=v;setF(v)}e.target.blur()}});
document.querySelectorAll('.step').forEach(b=>b.onclick=()=>setF(S.f+ +b.dataset.s,true));
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;S.mode=m;document.querySelectorAll('#modes .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===m));place();audioUpdate();userList()};
$('band-sel').onchange=e=>{if(e.target.value){S.cf=+e.target.value;setF(+e.target.value)}};
function zoom(z){S.z=Math.max(0,Math.min(10,z));S.cf=S.f;drawRuler();place();userList()}
$('zin').onclick=()=>zoom(S.z+1);$('zout').onclick=()=>zoom(S.z-1);$('zmax').onclick=()=>zoom(8);$('zall').onclick=()=>zoom(0);
$('tl').onclick=()=>setF(S.f-view().span/10,true);$('tr').onclick=()=>setF(S.f+view().span/10,true);
$('reset').onclick=()=>{S.z=0;S.cf=C.startFreqKHz;setF(C.startFreqKHz);S.rf=0;S.min=C.wfMinDb;S.max=C.wfMaxDb};
$('autoBtn').onclick=()=>{S.auto=!S.auto;$('autoBtn').style.opacity=S.auto?1:.4};
$('spec').onclick=()=>$('spec').classList.toggle('on');
$('tabs').onclick=e=>{if(e.target.dataset.p)pane(e.target.dataset.p)};
$('tabs').addEventListener('dblclick',()=>{});
addEventListener('resize',resize);

$('freq').value=S.f.toFixed(2);document.querySelectorAll('#modes .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===S.mode));resize();pane('user');setF(C.startFreqKHz);requestAnimationFrame(frame);if(LIVE)connect();
}
(async()=>{let j={};
 try{const r=await fetch('config.json?_='+Date.now(),{cache:'no-store'});if(r.ok)j=await r.json()}catch(e){}
 window.RX_CONFIG=merge(DEFAULTS,j);boot()})();
