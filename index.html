<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiwiSDR — SimSDR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&family=Chivo+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1014;--bar:#151d24;--bar2:#10171d;--line:#263540;
  --text:#d5e2e8;--dim:#7b909c;--amber:#f2b84b;--cyan:#5ce1e6;
  --ok:#64df9e;--red:#ff453a;--band:rgba(242,184,75,.20);--bandEdge:rgba(242,184,75,.78);
  --mono:"Chivo Mono",ui-monospace,Consolas,monospace
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 Chivo,system-ui,"Segoe UI",sans-serif;overflow:hidden}
.kiwi{display:flex;flex-direction:column;height:100vh}

/* KiwiSDR-style top control bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,var(--bar),var(--bar2));border-bottom:1px solid var(--line)}
.freq-wrap{display:flex;align-items:baseline;gap:5px;background:#06090c;border:1px solid #2e404d;border-radius:4px;padding:3px 9px;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
#dial{width:9.5ch;background:transparent;border:0;padding:0;color:var(--amber);font:600 24px/1.1 var(--mono);text-align:right;letter-spacing:.02em}
#dial:focus{outline:none}
.freq-wrap:focus-within{border-color:var(--cyan)}
.unit{font:600 12px var(--mono);color:var(--cyan);user-select:none}

.grp{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px}
select,input[type=range],input[type=number],button{background:#090d11;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:12px/1.2 var(--mono)}
#bw{width:7.5ch;text-align:right;color:var(--amber)}
select:hover,button:hover,#bw:hover,#bw:focus{border-color:var(--cyan);outline:none}
button{cursor:pointer;color:var(--text)}
button.active{border-color:var(--cyan);color:var(--cyan)}
#rec.recording{border-color:var(--red);color:#fff;background:rgba(255,69,58,.24);box-shadow:0 0 8px rgba(255,69,58,.35)}
input[type=range]{width:76px;padding:0;accent-color:var(--amber);cursor:pointer}

.zgrp{display:flex;align-items:center;gap:3px;margin-left:4px}
.zgrp button{padding:3px 7px;min-width:24px}
#zinfo{color:var(--cyan);font:12px var(--mono);margin-left:4px}

.right{margin-left:auto;display:flex;align-items:center;gap:8px}
#status{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:3px;background:#10171d;color:var(--dim);border:1px solid var(--line)}
#status.wait{color:var(--amber);border-color:rgba(242,184,75,.4);background:rgba(242,184,75,.08)}
#status.on{color:var(--ok);border-color:rgba(100,223,158,.45);background:rgba(100,223,158,.08)}

/* Frequency ruler strip */
.ruler{display:flex;justify-content:space-between;align-items:center;padding:3px 12px;background:#0e1419;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--dim);user-select:none}
.ruler b{color:var(--amber);font-weight:600}
.ruler .hint{color:#5e727e}

/* Spectrum + Waterfall stack */
.display{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#05080b}
canvas{display:block;width:100%;cursor:crosshair}
#spec{height:20%;min-height:75px;max-height:110px;border-bottom:1px solid #1d2a33}
#wf{flex:1;min-height:220px}

/* Tuning line & draggable passband overlay */
#mk{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#mk i{position:absolute;top:0;bottom:0;display:block}
#mk .band{background:var(--band);border-left:2px solid var(--bandEdge);border-right:2px solid var(--bandEdge);pointer-events:auto;cursor:ew-resize;touch-action:none}
#mk .band:hover,#mk .band.dragging{background:rgba(242,184,75,.28);border-color:var(--cyan)}
#mk .line{width:2px;margin-left:-1px;background:var(--red);box-shadow:0 0 6px rgba(255,69,58,.65)}
#mk .center{width:1px;border-left:1px dashed rgba(92,225,230,.28)}
</style>
</head>
<body>
<div class="kiwi">
  <header class="top">
    <div class="freq-wrap" title="Type frequency in kHz (e.g. 4625.000 or 500) or scroll wheel (Shift = fine)">
      <input id="dial" aria-label="Frequency in kHz" value="4625.000">
      <span class="unit">kHz</span>
    </div>

    <div class="grp">
      <span>MODE</span>
      <select id="mode">
        <option>AM</option>
        <option selected>USB</option>
        <option>LSB</option>
        <option>CW</option>
      </select>
    </div>

    <div class="grp">
      <span>BW</span>
      <input id="bw" type="number" min="50" max="12000" step="50" aria-label="Bandwidth in Hz" title="Filter bandwidth in Hz (or drag passband edges)">
      <span id="bwmax" class="unit">/ 5000 Hz</span>
    </div>

    <div class="grp">
      <span>GAIN</span>
      <span>0 dB</span>
    </div>

    <div class="grp">
      <span>VOL</span>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6">
    </div>

    <div class="grp">
      <span>WF</span>
      <select id="cmap">
        <option value="teejeez" selected>Teejeez</option>
        <option value="classic">Amber/Teal</option>
      </select>
    </div>

    <div class="zgrp">
      <button id="zin" type="button" title="Zoom in">+</button>
      <button id="zout" type="button" title="Zoom out">−</button>
      <button type="button" data-z="1" title="1x zoom">1x</button>
      <button type="button" data-z="4" title="4x zoom">4x</button>
      <button type="button" data-z="16" title="16x zoom">16x</button>
      <button type="button" data-z="32" title="32x zoom">32x</button>
      <span id="zinfo">1.0x · 16384</span>
    </div>

    <div class="right">
      <button id="rec" type="button" title="Record demodulated audio to WAV">Record</button>
      <span id="status" class="wait">checking bridge</span>
    </div>
  </header>

  <div class="ruler">
    <span id="sl">---</span>
    <span>CENTER <b id="sc">---</b> · <span class="hint">Click to tune · Drag passband edges for BW · Scroll to zoom</span></span>
    <span id="sr">---</span>
  </div>

  <main class="display">
    <canvas id="spec" width="1024" height="100"></canvas>
    <canvas id="wf" width="1024" height="460"></canvas>
    <div id="mk">
      <i class="center" style="left:50%"></i>
      <i id="bandEl" class="band" title="Drag left/right edges to adjust bandwidth"></i>
      <i class="line"></i>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script>
const C = CONFIG, $ = (i) => document.getElementById(i), TAU = 2 * Math.PI;
const fs = C.SAMPLE_RATE, D = Math.round(fs / 48000), ar = fs / D;
let ws = null, actx = null, nextT = 0, center = C.CENTER_FREQ, off = 0;
let connecting = false, reconnectTimer = null;

// Mode max bandwidth limits: AM = 12 kHz, USB/LSB = 5 kHz, CW = 500 Hz
const MODE_LIMITS = {
  AM:  { maxBw: 12000, defaultBw: 12000, side: 'sym',  cwShift: 0 },
  USB: { maxBw: 5000,  defaultBw: 5000,  side: 'usb',  cwShift: 0 },
  LSB: { maxBw: 5000,  defaultBw: 5000,  side: 'lsb',  cwShift: 0 },
  CW:  { maxBw: 500,   defaultBw: 500,   side: 'sym',  cwShift: -700 },
};

const modeBw = {
  AM:  MODE_LIMITS.AM.defaultBw,
  USB: MODE_LIMITS.USB.defaultBw,
  LSB: MODE_LIMITS.LSB.defaultBw,
  CW:  MODE_LIMITS.CW.defaultBw,
};

function getModeSpec(modeName = $('mode').value, bwOverride = null) {
  const lim = MODE_LIMITS[modeName] || MODE_LIMITS.USB;
  const bw = Math.max(50, Math.min(lim.maxBw, Math.round(bwOverride ?? modeBw[modeName] ?? lim.defaultBw)));
  if (lim.side === 'sym') {
    const half = bw * 0.5;
    return {
      bw,
      maxBw: lim.maxBw,
      s: lim.cwShift,
      c: Math.max(100, half),
      p: 0,
      lo: -half,
      hi: half,
    };
  }
  if (lim.side === 'usb') {
    return {
      bw,
      maxBw: lim.maxBw,
      s: bw * 0.5,
      c: Math.max(200, bw * 0.5),
      p: bw * 0.5,
      lo: 0,
      hi: bw,
    };
  }
  return {
    bw,
    maxBw: lim.maxBw,
    s: -bw * 0.5,
    c: Math.max(200, bw * 0.5),
    p: -bw * 0.5,
    lo: -bw,
    hi: 0,
  };
}

function syncBwUI() {
  const m = $('mode').value;
  const spec = getModeSpec(m);
  modeBw[m] = spec.bw;
  const inp = $('bw');
  inp.max = String(spec.maxBw);
  inp.value = String(spec.bw);
  $('bwmax').textContent = `/ ${spec.maxBw} Hz`;
}

function setBandwidth(newBw) {
  const m = $('mode').value;
  const spec = getModeSpec(m, newBw);
  modeBw[m] = spec.bw;
  $('bw').value = String(spec.bw);
  marker();
}

// ---- zoom state ---------------------------------------------------------
const MAX_ZOOM = 64;
let zoom = 1, zoomCenterOff = 0;
function syncZoomButtons() {
  for (const b of document.querySelectorAll('[data-z]')) {
    const zv = +b.dataset.z;
    b.classList.toggle('active', Math.abs(zoom - zv) < 0.05);
  }
}
function clampZoom() {
  zoom = Math.max(1, Math.min(MAX_ZOOM, zoom));
  const halfSpan = (fs / zoom) * 0.5;
  const maxOff = Math.max(0, fs * 0.5 - halfSpan);
  zoomCenterOff = Math.max(-maxOff, Math.min(maxOff, zoomCenterOff));
  $('zinfo').textContent = `${zoom.toFixed(zoom < 10 ? 1 : 0)}x · 16384`;
  syncZoomButtons();
  labels(); marker();
}
function xToFreqOff(normX) {
  const span = fs / zoom;
  return zoomCenterOff + (normX - 0.5) * span;
}
function freqOffToNormX(fOff) {
  const span = fs / zoom;
  return (fOff - zoomCenterOff) / span + 0.5;
}

// ---- tuning -------------------------------------------------------------
const dial = $('dial');
const fmtKhz = (f) => (Math.round(f) / 1e3).toFixed(3);
function sendWS(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function setDial(f) {
  f = Math.max(C.MIN_FREQ, Math.min(C.MAX_FREQ, Math.round(f)));
  const halfFs = fs * 0.5;
  if (Math.abs(f - center) > halfFs) {
    center = Math.max(halfFs, Math.min(C.MAX_FREQ - halfFs, f));
    zoomCenterOff = 0;
    sendWS({ t: 'freq', v: center + C.UPCONVERTER });
    sendWS({ t: 'gain', v: 0 });
  }
  off = f - center;

  const halfSpan = (fs / zoom) * 0.5;
  if (off < zoomCenterOff - halfSpan) {
    zoomCenterOff = off + halfSpan * 0.75;
  } else if (off > zoomCenterOff + halfSpan) {
    zoomCenterOff = off - halfSpan * 0.75;
  }

  dial.value = fmtKhz(center + off);
  clampZoom();
}
function labels() {
  const lOff = xToFreqOff(0), cOff = xToFreqOff(0.5), rOff = xToFreqOff(1);
  $('sl').textContent = ((center + lOff) / 1e6).toFixed(4) + ' MHz';
  $('sc').textContent = ((center + cOff) / 1e6).toFixed(4) + ' MHz';
  $('sr').textContent = ((center + rOff) / 1e6).toFixed(4) + ' MHz';
}
dial.onchange = () => {
  const v = parseFloat(dial.value);
  if (!Number.isFinite(v)) { dial.value = fmtKhz(center + off); return; }
  const hz = v >= 1000000 ? v : v * 1e3;
  setDial(hz);
};
dial.onwheel = (e) => {
  e.preventDefault();
  setDial(center + off + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 100 : 1000));
};
for (const c of [$('spec'), $('wf')]) {
  c.onclick = (e) => {
    const r = c.getBoundingClientRect();
    const nx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    setDial(center + xToFreqOff(nx));
  };
  c.onwheel = (e) => {
    e.preventDefault();
    const r = c.getBoundingClientRect();
    const nx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const anchorOff = xToFreqOff(nx);
    const factor = e.deltaY < 0 ? 1.25 : 1 / 1.25;
    const nextZoom = Math.max(1, Math.min(MAX_ZOOM, zoom * factor));
    const nextSpan = fs / nextZoom;
    zoomCenterOff = anchorOff - (nx - 0.5) * nextSpan;
    zoom = nextZoom;
    clampZoom();
  };
}
$('zin').onclick = () => { zoom *= 1.35; clampZoom(); };
$('zout').onclick = () => { zoom /= 1.35; clampZoom(); };
for (const b of document.querySelectorAll('[data-z]')) {
  b.onclick = () => {
    const targetZ = +b.dataset.z;
    if (targetZ === 1) { zoom = 1; zoomCenterOff = 0; }
    else { zoom = targetZ; zoomCenterOff = off; }
    clampZoom();
  };
}

function marker() {
  const m = getModeSpec();
  const a = freqOffToNormX(off + m.lo) * 100;
  const b = freqOffToNormX(off + m.hi) * 100;
  const x = freqOffToNormX(off) * 100;
  const k = $('mk').children;
  k[1].style.left = a + '%';
  k[1].style.width = Math.max(b - a, 0.35) + '%';
  k[2].style.left = x + '%';
}

{
  const bandEl = $('bandEl');
  let dragSide = null;
  bandEl.onpointerdown = (e) => {
    e.stopPropagation();
    const rect = bandEl.getBoundingClientRect();
    const mid = rect.left + rect.width * 0.5;
    dragSide = e.clientX >= mid ? 'right' : 'left';
    bandEl.classList.add('dragging');
    bandEl.setPointerCapture(e.pointerId);
  };
  bandEl.onpointermove = (e) => {
    if (!dragSide) return;
    const parentRect = $('mk').getBoundingClientRect();
    const nx = Math.max(0, Math.min(1, (e.clientX - parentRect.left) / parentRect.width));
    const fAtPointer = xToFreqOff(nx);
    const modeName = $('mode').value;
    const lim = MODE_LIMITS[modeName] || MODE_LIMITS.USB;
    let bwVal;
    if (lim.side === 'sym') {
      bwVal = Math.abs(fAtPointer - off) * 2;
    } else if (lim.side === 'usb') {
      bwVal = dragSide === 'right' ? (fAtPointer - off) : (off - fAtPointer);
    } else {
      bwVal = dragSide === 'left' ? (off - fAtPointer) : (fAtPointer - off);
    }
    setBandwidth(bwVal);
  };
  const stopDrag = (e) => {
    if (!dragSide) return;
    dragSide = null;
    bandEl.classList.remove('dragging');
    if (e && bandEl.hasPointerCapture && bandEl.hasPointerCapture(e.pointerId)) {
      bandEl.releasePointerCapture(e.pointerId);
    }
  };
  bandEl.onpointerup = stopDrag;
  bandEl.onpointercancel = stopDrag;
}

$('bw').onchange = () => setBandwidth(parseFloat($('bw').value));
$('bw').onwheel = (e) => {
  e.preventDefault();
  setBandwidth(modeBw[$('mode').value] + (e.deltaY < 0 ? 100 : -100));
};
$('mode').onchange = () => { syncBwUI(); marker(); };

dial.value = fmtKhz(center);
syncBwUI();
clampZoom();

// ---- bridge alive check + auto-connect ---------------------------------
function getBridgeEndpoints() {
  const raw = (C.WS_URL || '').trim();
  if (raw) {
    const wsUrl = raw
      .replace(/^https:\/\//i, 'wss://')
      .replace(/^http:\/\//i, 'ws://');
    const httpUrl = raw
      .replace(/^wss:\/\//i, 'https://')
      .replace(/^ws:\/\//i, 'http://');
    return { wsUrl, httpUrl };
  }
  const host = C.WS_HOST ? `${C.WS_HOST}:${C.WS_PORT}` : location.host;
  const isSecure = location.protocol === 'https:';
  return {
    wsUrl: `${isSecure ? 'wss:' : 'ws:'}//${host}`,
    httpUrl: `${isSecure ? 'https:' : 'http:'}//${host}`,
  };
}

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = cls || '';
}

function scheduleCheck(delayMs = 2500) {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(checkBridgeAndConnect, delayMs);
}

async function isBridgeAlive(httpUrl) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 2500);
  try {
    const res = await fetch(httpUrl, {
      method: 'GET',
      cache: 'no-store',
      signal: ctrl.signal,
    });
    return res.ok;
  } catch (_) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') {
    actx.resume().catch(() => {});
  }
}

function openSocket(wsUrl) {
  if (ws || connecting) return;
  connecting = true;
  setStatus('connecting', 'wait');

  const sock = new WebSocket(wsUrl);
  sock.binaryType = 'arraybuffer';

  sock.onopen = () => {
    connecting = false;
    ws = sock;
    ensureAudio();
    setStatus('receiving', 'on');
    sendWS({ t: 'freq', v: center + C.UPCONVERTER });
    sendWS({ t: 'gain', v: 0 });
    setDial(center + off);
  };

  sock.onmessage = (e) => {
    if (typeof e.data === 'string') return;
    const u = new Uint8Array(e.data);
    pushIQ(u);
    audio(dsp(u));
  };

  sock.onerror = () => {};

  sock.onclose = () => {
    connecting = false;
    if (ws === sock) ws = null;
    setStatus('bridge offline', 'wait');
    scheduleCheck(2500);
  };
}

async function checkBridgeAndConnect() {
  if (ws && ws.readyState === 1) return;
  if (connecting) return;
  const { wsUrl, httpUrl } = getBridgeEndpoints();
  setStatus('checking bridge', 'wait');
  const alive = await isBridgeAlive(httpUrl);
  if (!alive) {
    setStatus('bridge offline', 'wait');
    scheduleCheck(2500);
    return;
  }
  openSocket(wsUrl);
}

window.addEventListener('pointerdown', ensureAudio, { once: false, passive: true });
window.addEventListener('keydown', ensureAudio, { once: false, passive: true });

// ---- WAV recorder (SimSDR_{date}_{time}.wav) -----------------------------
let recording = false, recChunks = [], recSamples = 0;

function formatStamp(d = new Date()) {
  const pad = (n) => String(n).padStart(2, '0');
  const date = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const time = `${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
  return `${date}_${time}`;
}

function encodeWav(chunks, totalSamples, sampleRate) {
  const bytesPerSample = 2;
  const dataBytes = totalSamples * bytesPerSample;
  const buf = new ArrayBuffer(44 + dataBytes);
  const view = new DataView(buf);

  const writeStr = (offset, s) => {
    for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
  };

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataBytes, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, Math.round(sampleRate), true);
  view.setUint32(28, Math.round(sampleRate) * bytesPerSample, true);
  view.setUint16(32, bytesPerSample, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, dataBytes, true);

  let offset = 44;
  for (const chunk of chunks) {
    for (let i = 0; i < chunk.length; i++) {
      const clamped = Math.max(-1, Math.min(1, chunk[i]));
      const pcm = clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff;
      view.setInt16(offset, pcm, true);
      offset += 2;
    }
  }
  return new Blob([buf], { type: 'audio/wav' });
}

$('rec').onclick = () => {
  ensureAudio();
  if (!recording) {
    recChunks = [];
    recSamples = 0;
    recording = true;
    $('rec').textContent = 'Stop Rec';
    $('rec').classList.add('recording');
  } else {
    recording = false;
    $('rec').textContent = 'Record';
    $('rec').classList.remove('recording');
    if (recSamples > 0) {
      const blob = encodeWav(recChunks, recSamples, ar);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `SimSDR_${formatStamp()}.wav`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    recChunks = [];
    recSamples = 0;
  }
};

// ---- demodulator & audio ------------------------------------------------
let oc = 1, os = 0, ra = 0, qa = 0, cnt = 0, pph = 0, dc = 0, agc = 0.01;
const f1 = [0, 0], f2 = [0, 0];
function dsp(u8) {
  const modeName = $('mode').value;
  const m = getModeSpec(modeName);
  const n = u8.length >> 1, out = new Float32Array((n / D | 0) + 2);
  const w = -TAU * (off + m.s) / fs, wr = Math.cos(w), wi = Math.sin(w);
  const a = 1 - Math.exp(-TAU * m.c / ar), pw = TAU * m.p / ar, am = modeName === 'AM';
  let k = 0;
  for (let i = 0; i < n; i++) {
    const I = (u8[2 * i] - 127.5) / 128, Q = (u8[2 * i + 1] - 127.5) / 128;
    ra += I * oc - Q * os; qa += I * os + Q * oc;
    const t = oc * wr - os * wi; os = oc * wi + os * wr; oc = t;
    if (++cnt < D) continue;
    cnt = 0;
    f1[0] += a * (ra / D - f1[0]); f1[1] += a * (qa / D - f1[1]);
    f2[0] += a * (f1[0] - f2[0]); f2[1] += a * (f1[1] - f2[1]);
    ra = qa = 0;
    const zr = f2[0], zi = f2[1]; let y;
    if (am) {
      const mg = Math.hypot(zr, zi);
      dc += 0.001 * (mg - dc);
      y = mg - dc;
    } else {
      pph += pw;
      y = zr * Math.cos(pph) - zi * Math.sin(pph);
    }
    const ab = Math.abs(y); agc += (ab - agc) * (ab > agc ? 0.01 : 0.0005);
    y = Math.max(-1, Math.min(1, y / (agc * 3 + 1e-3) * 0.5));
    out[k++] = y;
  }
  const h = Math.hypot(oc, os) || 1; oc /= h; os /= h; pph %= TAU;
  const sub = out.subarray(0, k);
  if (recording && sub.length) {
    recChunks.push(new Float32Array(sub));
    recSamples += sub.length;
  }
  return sub;
}
function audio(s) {
  if (!actx || !s.length) return;
  const b = actx.createBuffer(1, s.length, ar), v = +$('vol').value;
  const d = b.getChannelData(0); for (let i = 0; i < s.length; i++) d[i] = s[i] * v;
  const src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination);
  if (nextT < actx.currentTime || nextT > actx.currentTime + 0.6) nextT = actx.currentTime + 0.08;
  src.start(nextT); nextT += s.length / ar;
}

// ---- 16384-point FFT + Teejeez waterfall + zoom --------------------------
const N = 16384, BITS = 14;
const re = new Float32Array(N), im = new Float32Array(N), win = new Float32Array(N), rev = new Uint16Array(N);
for (let i = 0; i < N; i++) {
  win[i] = 0.5 - 0.5 * Math.cos(TAU * i / N);
  let r = 0;
  for (let b = 0; b < BITS; b++) r |= ((i >> b) & 1) << (BITS - 1 - b);
  rev[i] = r;
}

const IQ_CAP = N * 2;
const iqI = new Float32Array(IQ_CAP), iqQ = new Float32Array(IQ_CAP);
let iqHead = 0, iqCount = 0;
function pushIQ(u8) {
  const pairs = u8.length >> 1;
  for (let i = 0; i < pairs; i++) {
    iqI[iqHead] = (u8[2 * i] - 127.5) / 128;
    iqQ[iqHead] = (u8[2 * i + 1] - 127.5) / 128;
    iqHead = (iqHead + 1) % IQ_CAP;
    if (iqCount < IQ_CAP) iqCount++;
  }
}

function fft() {
  for (let len = 2; len <= N; len <<= 1) {
    const h = len >> 1, ang = -TAU / len;
    for (let i = 0; i < N; i += len) {
      for (let j = 0; j < h; j++) {
        const c = Math.cos(ang * j), s = Math.sin(ang * j);
        const p = i + j, q = p + h;
        const tr = re[q] * c - im[q] * s, ti = re[q] * s + im[q] * c;
        re[q] = re[p] - tr; im[q] = im[p] - ti;
        re[p] += tr; im[p] += ti;
      }
    }
  }
}

function buildLUT(hexStops) {
  const stops = hexStops.map((hex, idx) => {
    const v = idx / (hexStops.length - 1);
    const n = parseInt(hex.slice(1), 16);
    return [v, (n >> 16) & 255, (n >> 8) & 255, n & 255];
  });
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const v = i / 255;
    let k = 1;
    while (k < stops.length - 1 && stops[k][0] < v) k++;
    const A = stops[k - 1], B = stops[k];
    const t = B[0] > A[0] ? (v - A[0]) / (B[0] - A[0]) : 0;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(A[c + 1] + (B[c + 1] - A[c + 1]) * t);
  }
  return lut;
}

const PALETTES = {
  teejeez: buildLUT(['#000000', '#0000FF', '#00FFFF', '#00FF00', '#FFFF00', '#FF0000', '#FF00FF', '#FFFFFF']),
  classic: buildLUT(['#080e1a', '#145a6e', '#e9b04a', '#fffbe6']),
};
let activeLUT = PALETTES.teejeez;
$('cmap').onchange = (e) => { activeLUT = PALETTES[e.target.value] || PALETTES.teejeez; };

const sp = $('spec').getContext('2d'), wc = $('wf'), wx = wc.getContext('2d');
const W = 1024, row = wx.createImageData(W, 1);
const db = new Float32Array(N); let lo = -95, hi = -35;

setInterval(() => {
  if (iqCount < N) return;
  const start = (iqHead - N + IQ_CAP) % IQ_CAP;
  for (let i = 0; i < N; i++) {
    const idx = (start + i) % IQ_CAP;
    const rIdx = rev[i];
    re[rIdx] = iqI[idx] * win[i];
    im[rIdx] = iqQ[idx] * win[i];
  }
  fft();

  let mean = 0;
  for (let i = 0; i < N; i++) {
    const k = (i + N / 2) % N;
    const p = (re[k] * re[k] + im[k] * im[k]) / (N * N / 4) + 1e-13;
    db[i] = db[i] * 0.55 + 0.45 * 10 * Math.log10(p);
    mean += db[i];
  }
  mean /= N;
  lo += (mean - 6 - lo) * 0.05;
  hi += (mean + 42 - hi) * 0.05;

  wx.drawImage(wc, 0, 1);
  const H = $('spec').height;
  sp.fillStyle = '#05080b';
  sp.fillRect(0, 0, W, H);

  sp.strokeStyle = 'rgba(92,225,230,.12)';
  sp.lineWidth = 1;
  for (let g = 1; g < 3; g++) {
    const gy = (H * g) / 3;
    sp.beginPath(); sp.moveTo(0, gy); sp.lineTo(W, gy); sp.stroke();
  }

  sp.strokeStyle = '#5ce1e6';
  sp.lineWidth = 1.3;
  sp.beginPath();

  const span = fs / zoom;
  const fStart = zoomCenterOff - span * 0.5;

  for (let px = 0; px < W; px++) {
    const fOff = fStart + (px / (W - 1)) * span;
    const binFloat = (fOff / fs + 0.5) * (N - 1);
    const b0 = Math.max(0, Math.min(N - 1, Math.floor(binFloat)));
    const b1 = Math.min(N - 1, b0 + 1);
    const frac = binFloat - b0;
    const valDb = db[b0] * (1 - frac) + db[b1] * frac;

    const v = Math.max(0, Math.min(1, (valDb - lo) / (hi - lo)));
    const py = H - 2 - v * (H - 6);
    if (px === 0) sp.moveTo(px, py);
    else sp.lineTo(px, py);

    const ci = (v * 255) | 0;
    row.data[px * 4]     = activeLUT[ci * 3];
    row.data[px * 4 + 1] = activeLUT[ci * 3 + 1];
    row.data[px * 4 + 2] = activeLUT[ci * 3 + 2];
    row.data[px * 4 + 3] = 255;
  }
  sp.stroke();
  wx.putImageData(row, 0, 0);
}, 45);

checkBridgeAndConnect();
</script>
