<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HF Receiver 0–30 MHz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a0c0f;--panel:#11151a;--line:#222b35;--txt:#d5dde6;--dim:#7a8695;--acc:#22d3ee;--tune:#ff5a4d;--warn:#ffb020;--ok:#5ee08a;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:12px/1.4 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px;padding:6px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 4px}
.brand{font-weight:600;letter-spacing:.04em}
#rf{font-size:26px;font-weight:600;color:var(--tune);letter-spacing:.02em}
#rfu{color:var(--dim);margin-left:4px}
.badge{border:1px solid var(--line);padding:1px 8px;border-radius:3px;color:var(--acc);font-weight:600}
.badge.warn{color:var(--warn);border-color:#5a4210}
.dim{color:var(--dim)}
.sp{flex:1}
main{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:6px;min-height:0}
#disp{display:grid;grid-template-rows:150px 28px minmax(0,1fr);min-height:0;min-width:0;background:#000;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ctl{background:var(--panel);border:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
h2{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--dim)}
.row{display:flex;gap:4px;align-items:center}
.grid{display:grid;gap:4px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
button,select,input{font:inherit;color:var(--txt);background:#0b0f13;border:1px solid var(--line);border-radius:3px;padding:5px 6px}
button{cursor:pointer}
button:hover{border-color:#3b4a5a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#02181d;font-weight:600}
#fin{width:100%;min-width:0;text-align:right}
#run.on{border-color:#2d6b45;color:var(--ok)}
#run.off{border-color:#6b2d2d;color:var(--tune)}
input[type=range]{width:100%;padding:0;accent-color:var(--acc)}
#sm{position:relative;height:16px;background:#0b0f13;border:1px solid var(--line)}
#sbar{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#1f9d6a 0,#5ee08a 55%,#ffb020 62%,#ff5a4d 100%);background-size:272px 100%}
#sscale{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-top:2px}
#sread{font-size:18px;font-weight:600}
@media (max-width:780px){
 body{height:auto;overflow:auto}
 #app{height:auto}
 main{grid-template-columns:1fr}
 #disp{grid-template-rows:120px 28px 300px}
 #rf{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="brand">HF receiver</div>
 <div><span id="rf">14.200</span><span id="rfu">MHz</span></div>
 <span id="mb" class="badge">USB</span>
 <span id="bwt" class="dim"></span>
 <span class="sp"></span>
 <span class="dim" id="hov">cursor –</span>
 <span id="src" class="badge warn" title="No SDR hardware is connected. Spectrum, audio and S-meter come from a built-in simulator.">simulated data</span>
</header>
<main>
 <section id="disp">
  <canvas id="spec" aria-label="Signal spectrum"></canvas>
  <canvas id="axis" aria-label="Frequency scale"></canvas>
  <canvas id="wf" aria-label="Waterfall"></canvas>
 </section>
 <aside id="ctl">
  <div><h2>Source</h2>
   <select id="srcsel" style="width:100%"><option value="rtl">RTL-TCP via WebSocket</option><option value="sim">Simulated</option></select>
   <div class="row" style="margin-top:4px"><input id="wsurl" style="flex:1;min-width:0" aria-label="WebSocket URL"><button id="conn">Connect</button></div>
   <div class="dim" id="cstat" style="margin-top:4px">idle</div></div>
  <div>
   <h2>Frequency</h2>
   <div class="row"><button id="dn" aria-label="Step down">−</button><input id="fin" type="number" step="1" min="10" max="30000" aria-label="Frequency in kilohertz"><span class="dim">kHz</span><button id="up" aria-label="Step up">+</button></div>
   <div class="row" style="margin-top:4px"><span class="dim">Step</span>
    <select id="stp"><option>1</option><option>5</option><option selected>9</option><option>10</option><option>100</option></select><span class="dim">kHz</span></div>
  </div>
  <div><h2>Band</h2><div class="grid g4" id="bands"></div></div>
  <div><h2>Mode</h2><div class="grid g4" id="modes"></div>
   <div class="dim" style="margin-top:6px">Passband <span id="pb" style="color:var(--txt)"></span><br>Drag its edges on the display.</div></div>
  <div><h2>Audio</h2>
   <div class="row"><button id="run" class="on" style="flex:1">Stop</button><button id="mute" aria-pressed="false" style="flex:1">Mute</button></div>
   <div class="row" style="margin-top:8px"><span class="dim">Vol</span><input id="vol" type="range" min="0" max="100" value="60" aria-label="Volume"></div></div>
  <div><h2>S-meter</h2><div id="sm"><div id="sbar"></div></div>
   <div id="sscale"><span>1</span><span>3</span><span>5</span><span>7</span><span>9</span><span>+20</span><span>+40</span><span>+60</span></div>
   <div id="sread">S1 <span class="dim" style="font-size:12px;font-weight:400">−127 dBm</span></div></div>
 </aside>
</main>
</div>
<script>
/* ====== CONFIG (edit these) ====== */
const cfg={
 wsUrl:'wss://YOUR-SERVICE.code.run/ws',   // your Northflank bridge; add ?token=SECRET if you set TOKEN
 defaultSource:'rtl',           // 'rtl' or 'sim'
 autoConnect:true,
 sampleRate:2048000,            // rtl_tcp IQ rate; sets the live window width (about 2 MHz)
 directSampling:0,              // 0 off, 1 I branch, 2 Q branch (HF without an upconverter)
 upconverterMHz:0,              // e.g. 125 for a Ham It Up style upconverter
 gain:'auto',                   // 'auto' or a number in dB, e.g. 30
 ppm:0,                         // frequency correction
 calDb:-30                      // dBFS to approximate dBm offset; tune to your hardware
};
/* ================================= */
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const MAXF=30, N=16384, WH=400, MINSPAN=0.01;
const view={a:0,b:MAXF};
const rx={f:14.2,mode:'USB',lo:.1,hi:2.8,run:true,vol:.6,mute:false};
const MODES={AM:[-4.5,4.5],USB:[.1,2.8],LSB:[-2.8,-.1],CW:[-.25,.25]};
const BANDS=[['160 m',1.8,2.0,1.85],['80 m',3.5,4.0,3.75],['40 m',7.0,7.3,7.15],['20 m',14.0,14.35,14.2],['15 m',21.0,21.45,21.3],['10 m',28.0,29.7,28.4]];

/* ---------- Data source ----------
   A source supplies N power bins (dBm) spanning 0–30 MHz per frame.
   Replace `source` with a client for real hardware (KiwiSDR, OpenWebRX,
   a WebSDR gateway) that returns the same frame shape. */
const simSource=(()=>{
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const st=[];const add=(f,k,p)=>st.push({f,k,p,ph:rnd()*6.28,r:.3+rnd()*1.2});
 for(let f=.53;f<1.7;f+=.01*(1+Math.floor(rnd()*2)))if(rnd()<.7)add(f,'am',-95+rnd()*35);
 [5,10,15,20].forEach(f=>add(f,'car',-62));
 [[5.95,6.2],[7.2,7.45],[9.4,9.9],[11.6,12.1],[13.57,13.87],[15.1,15.8],[17.48,17.9],[21.45,21.85]].forEach(([a,b])=>{
  for(let f=a+.005;f<b;f+=.005*(1+Math.floor(rnd()*3)))if(rnd()<.75)add(Math.round(f*200)/200,'am',-100+rnd()*45)});
 [1.84,3.75,3.78,7.15,7.18,14.2,14.25,14.29,21.3,28.4,28.47].forEach(f=>add(f,'ssb',-88+rnd()*28));
 [1.83,3.55,7.03,7.04,10.11,14.03,14.05,21.03,28.03].forEach(f=>add(f,'cw',-92+rnd()*25));
 [3.573,7.074,10.136,14.074,21.074,28.074].forEach(f=>add(f,'dig',-90+rnd()*14));
 const bin=f=>f/MAXF*N;
 return{kind:'simulated',frame(t){
  const o=new Float32Array(N);
  for(let i=0;i<N;i++){const f=i/N*MAXF;o[i]=-113+9*Math.exp(-f/4)+(Math.random()-.5)*4}
  for(const s of st){
   const p=s.p+Math.sin(t*s.r+s.ph)*5;let lo=s.f,hi=s.f,lv=()=>p;
   if(s.k==='am'){lo=s.f-.0045;hi=s.f+.0045;lv=()=>p-14+Math.random()*3}
   else if(s.k==='ssb'){const on=Math.sin(t*.4+s.ph*5)>-.3;if(!on)continue;
    if(s.f<10)lo=s.f-.0027;else hi=s.f+.0027;const e=.5+.5*Math.sin(t*5+s.ph);lv=()=>p-10+9*Math.random()*e}
   else if(s.k==='cw'){if(Math.floor(t*(2+s.r*2)+s.ph*3)%3===0)continue}
   else if(s.k==='dig'){lo=s.f+.001;hi=s.f+.004;lv=()=>p-6+Math.random()*2}
   const i0=Math.floor(bin(lo)),i1=Math.max(i0,Math.ceil(bin(hi)));
   for(let i=i0;i<=i1&&i<N;i++){const v=lv();if(v>o[i])o[i]=v}
   if(s.k==='am'){const c=Math.round(bin(s.f));if(c<N)o[c]=Math.max(o[c],p)}
  }
  return o}}})();

let source=simSource;

/* ---------- rtl_tcp source: IQ over a WebSocket bridge, FFT + demodulation in JS ---------- */
const rtlSource=(()=>{
 const FN=2048,LG=11,api={onstatus:null};
 const ringI=new Float32Array(FN),ringQ=new Float32Array(FN),re=new Float32Array(FN),im=new Float32Array(FN),win=new Float32Array(FN),rev=new Uint16Array(FN),cs=new Float32Array(FN/2),sn=new Float32Array(FN/2);
 let sumw=0,ws=null,center=14.2,hdr=12,pend=-1,w=0,gotData=false;
 for(let i=0;i<FN;i++){win[i]=.5-.5*Math.cos(2*Math.PI*i/(FN-1));sumw+=win[i];let r=0;for(let j=0;j<LG;j++)if(i>>j&1)r|=1<<(LG-1-j);rev[i]=r}
 for(let k=0;k<FN/2;k++){cs[k]=Math.cos(2*Math.PI*k/FN);sn[k]=-Math.sin(2*Math.PI*k/FN)}
 const on=()=>!!ws&&ws.readyState===1;
 const status=t=>{api.onstatus&&api.onstatus(t)};
 const send=(c,v)=>{if(!on())return;const d=new DataView(new ArrayBuffer(5));d.setUint8(0,c);d.setUint32(1,v>>>0);ws.send(d.buffer)};
 function fft(){
  for(let size=2;size<=FN;size<<=1){const half=size>>1,step=FN/size;
   for(let i=0;i<FN;i+=size)for(let j=0,k=0;j<half;j++,k+=step){const a=i+j,b=a+half,tr=re[b]*cs[k]-im[b]*sn[k],ti=re[b]*sn[k]+im[b]*cs[k];re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti}}}
 api.frame=()=>{
  if(!on()||!gotData)return null;
  let mi=0,mq=0;for(let i=0;i<FN;i++){mi+=ringI[i];mq+=ringQ[i]}mi/=FN;mq/=FN;
  for(let i=0;i<FN;i++){const k=(w+i)&(FN-1);re[rev[i]]=(ringI[k]-mi)*win[i];im[rev[i]]=(ringQ[k]-mq)*win[i]}
  fft();
  const o=new Float32Array(N).fill(-200),sr=cfg.sampleRate,norm=sumw*sumw;
  for(let k=0;k<FN;k++){
   const f=center+(k<FN/2?k:k-FN)*sr/FN/1e6;if(f<0||f>=MAXF)continue;
   const q=k===0?1:k,p=10*Math.log10((re[q]*re[q]+im[q]*im[q])/norm+1e-12)+cfg.calDb,i=Math.floor(f/MAXF*N);
   if(p>o[i])o[i]=p}
  return o};
 api.on=on;api.win=()=>[center-cfg.sampleRate/2e6,center+cfg.sampleRate/2e6];
 api.follow=force=>{
  if(!on())return;const sM=cfg.sampleRate/1e6,d=Math.abs(rx.f-center);
  if(force||d>.4*sM||d<.05*sM){center=Math.max(sM/2,rx.f+.25*sM);send(1,Math.round((center+cfg.upconverterMHz)*1e6));
   status('live · '+(center-sM/2).toFixed(2)+'–'+(center+sM/2).toFixed(2)+' MHz')}};
 api.close=()=>{if(ws){ws.onclose=null;ws.close();ws=null}gotData=false;status('disconnected')};
 api.connect=url=>{
  api.close();status('connecting…');setup();
  try{ws=new WebSocket(url)}catch(e){status('bad URL');return}
  ws.binaryType='arraybuffer';hdr=12;pend=-1;gotData=false;
  ws.onopen=()=>{send(2,cfg.sampleRate);send(9,cfg.directSampling);send(5,cfg.ppm);
   if(cfg.gain==='auto')send(3,0);else{send(3,1);send(4,Math.round(cfg.gain*10))}
   api.follow(true)};
  ws.onmessage=e=>onData(e.data);
  ws.onerror=()=>status('cannot reach '+url+' (is the bridge running?)');
  ws.onclose=()=>{ws=null;status('disconnected')}};

 /* demodulator */
 let DEC=32,outRate=64000,ar=0,ai=0,dc=0,pr=1,pi=0,cr=1,ci=0,ph1=0,ph2=0,dcAm=.1,env=.01,nextT=0,an=0;
 const f1r=[0,0,0,0],f1i=[0,0,0,0],ACH=4096,ab=new Float32Array(ACH);
 function setup(){DEC=Math.max(1,Math.round(cfg.sampleRate/64000));outRate=cfg.sampleRate/DEC}
 function flush(){
  if(ac&&master&&ac.state==='running'){
   const b=ac.createBuffer(1,ACH,outRate);b.copyToChannel(ab,0);
   const s=ac.createBufferSource();s.buffer=b;s.connect(master);
   const now=ac.currentTime;if(nextT<now+.03||nextT>now+.6)nextT=now+.12;s.start(nextT);nextT+=ACH/outRate}
  an=0}
 function demod(zr,zi){
  const m=rx.mode,cf=m==='AM'?0:(rx.lo+rx.hi)/2*1000,bw=(rx.hi-rx.lo)/2*1000,fo=m==='CW'?600:cf;
  ph1-=2*Math.PI*cf/outRate;if(ph1<-6.2832)ph1+=6.2832;
  const c1=Math.cos(ph1),s1=Math.sin(ph1);let xr=zr*c1-zi*s1,xi=zr*s1+zi*c1;
  const a=1-Math.exp(-2*Math.PI*Math.max(bw,50)/outRate);
  for(let k=0;k<4;k++){f1r[k]+=a*(xr-f1r[k]);xr=f1r[k];f1i[k]+=a*(xi-f1i[k]);xi=f1i[k]}
  let y;
  if(m==='AM'){const e=Math.hypot(xr,xi);dcAm+=.002*(e-dcAm);y=(e-dcAm)/Math.max(dcAm,1e-4)*.5}
  else{ph2+=2*Math.PI*fo/outRate;if(ph2>6.2832)ph2-=6.2832;y=xr*Math.cos(ph2)-xi*Math.sin(ph2);env=Math.max(Math.abs(y),env*.9997);y*=.3/Math.max(env,.003)}
  ab[an++]=clamp(y,-1,1);if(an===ACH)flush()}
 function onData(buf){
  let u=new Uint8Array(buf),s=0;
  if(hdr>0){s=Math.min(hdr,u.length);hdr-=s}
  if(!rx.run)return;
  if(pend>=0&&s<u.length){const t=new Uint8Array(u.length-s+1);t[0]=pend;t.set(u.subarray(s),1);u=t;s=0;pend=-1}
  const phi=-2*Math.PI*(rx.f-center)*1e6/cfg.sampleRate;cr=Math.cos(phi);ci=Math.sin(phi);
  const end=u.length-((u.length-s)&1);
  for(let p=s;p<end;p+=2){
   const I=(u[p]-127.5)/127.5,Q=(u[p+1]-127.5)/127.5;
   ringI[w]=I;ringQ[w]=Q;w=(w+1)&(FN-1);
   const mr=I*pr-Q*pi,mi=I*pi+Q*pr,npr=pr*cr-pi*ci;pi=pr*ci+pi*cr;pr=npr;
   ar+=mr;ai+=mi;if(++dc===DEC){demod(ar/DEC,ai/DEC);ar=0;ai=0;dc=0}}
  if(end<u.length)pend=u[end];
  const mg=Math.hypot(pr,pi);pr/=mg;pi/=mg;gotData=true}
 return api})();

/* ---------- State ---------- */
let sm=new Float32Array(N).fill(-113), raw=sm, meter=-127, meterT=-127, tonePk=-120;
const oc=document.createElement('canvas');oc.width=N;oc.height=WH;const octx=oc.getContext('2d');octx.fillStyle='#000';octx.fillRect(0,0,N,WH);
const pal=new Uint32Array(256);
(()=>{const S=[[0,0,0,20],[.25,0,30,140],[.5,0,170,200],[.7,230,220,60],[.85,255,120,20],[1,255,255,255]];
 for(let i=0;i<256;i++){const t=i/255;let k=0;while(k<S.length-2&&t>S[k+1][0])k++;
  const a=S[k],b=S[k+1],u=(t-a[0])/(b[0]-a[0]);const c=[1,2,3].map(j=>Math.round(a[j]+(b[j]-a[j])*u));
  pal[i]=(255<<24)|(c[2]<<16)|(c[1]<<8)|c[0]}})();
const WF_MIN=-112,WF_MAX=-50;
function push(o){
 raw=o;for(let i=0;i<N;i++)sm[i]+=.55*(o[i]-sm[i]);
 octx.drawImage(oc,0,0,N,WH-1,0,1,N,WH-1);
 const row=octx.createImageData(N,1),u=new Uint32Array(row.data.buffer);
 for(let i=0;i<N;i++)u[i]=pal[clamp(((sm[i]-WF_MIN)/(WF_MAX-WF_MIN)*255)|0,0,255)];
 octx.putImageData(row,0,0);
 const i0=clamp(Math.floor((rx.f+rx.lo/1000)/MAXF*N),0,N-1),i1=clamp(Math.ceil((rx.f+rx.hi/1000)/MAXF*N),i0,N-1);
 let m=-200;for(let i=i0;i<=i1;i++)if(o[i]>m)m=o[i];meterT=m;tonePk=m;
}
for(let k=120;k>0;k--)push(source.frame(performance.now()/1000-k/12));
function clearWf(){octx.fillStyle='#000';octx.fillRect(0,0,N,WH);sm.fill(-200);meter=meterT=-127}

/* ---------- Geometry ---------- */
const fx=(f,w)=>(f-view.a)/(view.b-view.a)*w, xf=(x,w)=>view.a+x/w*(view.b-view.a);
function fit(c){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
 if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}
 const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]}
function ticks(w){
 const raw=(view.b-view.a)/Math.max(1,w/90),L=[.0005,.001,.002,.005,.01,.02,.05,.1,.2,.5,1,2,5];
 const step=L.find(s=>s>=raw)||5,mant=step/Math.pow(10,Math.floor(Math.log10(step)+1e-9)),minor=step/(Math.round(mant)===2?4:5);
 const dec=Math.max(0,Math.ceil(-Math.log10(step)-1e-9)),maj=[],mnr=[];
 for(let f=Math.ceil(view.a/step)*step;f<=view.b+1e-9;f+=step)maj.push([f,f.toFixed(dec)]);
 for(let f=Math.ceil(view.a/minor)*minor;f<=view.b+1e-9;f+=minor)mnr.push(f);
 return{maj,mnr}}
function overlay(x,w,h,handles){
 if(source===rtlSource&&rtlSource.on()){const[a0,b0]=rtlSource.win();x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,Math.max(0,fx(a0,w)),h);x.fillRect(Math.min(w,fx(b0,w)),0,w,h)}
 const a=fx(rx.f+rx.lo/1000,w),b=fx(rx.f+rx.hi/1000,w),t=fx(rx.f,w);
 x.fillStyle='rgba(255,90,77,.16)';x.fillRect(a,0,Math.max(2,b-a),h);
 x.strokeStyle='rgba(255,90,77,.9)';x.lineWidth=1;x.beginPath();x.moveTo(t+.5,0);x.lineTo(t+.5,h);x.stroke();
 if(handles){x.strokeStyle='rgba(255,170,150,.9)';x.beginPath();x.moveTo(a+.5,0);x.lineTo(a+.5,h);x.moveTo(b+.5,0);x.lineTo(b+.5,h);x.stroke()}}

/* ---------- Drawing ---------- */
const specC=$('spec'),axisC=$('axis'),wfC=$('wf');
const SP_MIN=-120,SP_MAX=-40;
function drawSpec(){
 const[x,w,h]=fit(specC);x.fillStyle='#0b0e12';x.fillRect(0,0,w,h);
 x.font='10px "IBM Plex Mono",monospace';x.lineWidth=1;
 const T=ticks(w);x.strokeStyle='rgba(34,211,238,.13)';x.beginPath();
 T.maj.forEach(([f])=>{const p=Math.round(fx(f,w))+.5;x.moveTo(p,0);x.lineTo(p,h)});
 for(let d=-100;d<=-40;d+=20){const y=Math.round(h*(1-(d-SP_MIN)/(SP_MAX-SP_MIN)))+.5;x.moveTo(0,y);x.lineTo(w,y)}x.stroke();
 x.fillStyle='#6b7785';for(let d=-100;d<=-40;d+=20)x.fillText('\u2212'+Math.abs(d),4,h*(1-(d-SP_MIN)/(SP_MAX-SP_MIN))-3);
 const Y=v=>h*(1-(clamp(v,SP_MIN,SP_MAX)-SP_MIN)/(SP_MAX-SP_MIN));
 x.beginPath();x.moveTo(0,h);
 for(let px=0;px<w;px++){
  const p0=xf(px,w)/MAXF*N,p1=xf(px+1,w)/MAXF*N;let v;
  if(p1-p0<1){const q=(p0+p1)/2-.5,k=Math.floor(q),fr=q-k;v=sm[clamp(k,0,N-1)]*(1-fr)+sm[clamp(k+1,0,N-1)]*fr}
  else{v=-999;for(let i=Math.floor(p0);i<Math.ceil(p1)&&i<N;i++)if(sm[i]>v)v=sm[i]}
  x.lineTo(px,Y(v))}
 x.lineTo(w,h);x.closePath();
 const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(34,211,238,.55)');g.addColorStop(1,'rgba(34,211,238,.05)');
 x.fillStyle=g;x.fill();x.strokeStyle='#22d3ee';x.stroke();
 overlay(x,w,h,true)}
function drawAxis(){
 const[x,w,h]=fit(axisC);x.fillStyle='#0f1318';x.fillRect(0,0,w,h);
 x.font='11px "IBM Plex Mono",monospace';x.textAlign='center';
 const T=ticks(w);x.strokeStyle='#3a4654';x.fillStyle='#aab5c1';x.beginPath();
 T.mnr.forEach(f=>{const p=Math.round(fx(f,w))+.5;x.moveTo(p,0);x.lineTo(p,4)});
 T.maj.forEach(([f,l])=>{const p=Math.round(fx(f,w))+.5;x.moveTo(p,0);x.lineTo(p,8)});x.stroke();
 T.maj.forEach(([f,l])=>{const p=fx(f,w);if(p>14&&p<w-34)x.fillText(l,p,20)});
 x.textAlign='right';x.fillStyle='#6b7785';x.fillText('MHz',w-4,20);
 BANDS.forEach(([n,a,b])=>{const A=fx(a,w),B=fx(b,w);if(B<0||A>w)return;
  x.fillStyle='rgba(34,211,238,.7)';x.fillRect(A,h-3,Math.max(1,B-A),3);
  if(B-A>34){x.fillStyle='#22d3ee';x.textAlign='center';x.font='9px "IBM Plex Mono",monospace';x.fillText(n,(A+B)/2,h-6)}});
 const a=fx(rx.f+rx.lo/1000,w),b=fx(rx.f+rx.hi/1000,w),t=fx(rx.f,w);
 x.fillStyle='rgba(255,90,77,.45)';x.fillRect(a,0,Math.max(2,b-a),3);
 x.fillStyle='#ff5a4d';x.beginPath();x.moveTo(t-5,0);x.lineTo(t+5,0);x.lineTo(t,7);x.fill()}
function drawWf(){
 const[x,w,h]=fit(wfC);x.fillStyle='#000';x.fillRect(0,0,w,h);x.imageSmoothingEnabled=true;
 const sx=view.a/MAXF*N,sw=(view.b-view.a)/MAXF*N;
 x.drawImage(oc,sx,0,sw,WH,0,0,w,h);overlay(x,w,h,true)}

/* ---------- Tuning, view, passband ---------- */
function setView(a,b){const s=clamp(b-a,MINSPAN,MAXF);a=clamp(a,0,MAXF-s);view.a=a;view.b=a+s}
function tune(f,ensure){
 rx.f=clamp(Math.round(f*1000)/1000,.01,29.999);if(source===rtlSource)rtlSource.follow();
 if(ensure&&(rx.f<view.a||rx.f>view.b)){const s=view.b-view.a;setView(rx.f-s/2,rx.f+s/2)}
 ui()}
function setMode(m,keep){rx.mode=m;if(!keep){[rx.lo,rx.hi]=MODES[m]}applyAudio();ui()}
function ui(){
 $('rf').textContent=rx.f.toFixed(3);$('mb').textContent=rx.mode;
 const w=rx.hi-rx.lo;$('bwt').textContent=(w>=1?w.toFixed(1)+' kHz':Math.round(w*1000)+' Hz')+' wide';
 $('pb').textContent=(rx.lo>0?'+':'')+rx.lo.toFixed(2)+' to '+(rx.hi>0?'+':'')+rx.hi.toFixed(2)+' kHz';
 if(document.activeElement!==$('fin'))$('fin').value=Math.round(rx.f*1000);
 document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===rx.mode));
 document.querySelectorAll('#bands button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f&&rx.f>=+b.dataset.a&&rx.f<=+b.dataset.b))}
function setEdge(which,fm){
 const off=(fm-rx.f)*1000,M=rx.mode;
 if(M==='AM'||M==='CW'){const v=clamp(Math.abs(off),.1,M==='AM'?10:1.5);rx.lo=-v;rx.hi=v}
 else if(M==='USB'){if(which==='hi')rx.hi=clamp(off,rx.lo+.1,6);else rx.lo=clamp(off,0,rx.hi-.1)}
 else{if(which==='lo')rx.lo=clamp(off,-6,rx.hi-.1);else rx.hi=clamp(off,rx.lo+.1,0)}
 ui()}

/* ---------- Pointer interaction ---------- */
[specC,axisC,wfC].forEach(c=>{
 let drag=null;
 const px=e=>e.clientX-c.getBoundingClientRect().left;
 const edgeAt=x=>{if(c===axisC)return null;const w=c.clientWidth,a=fx(rx.f+rx.lo/1000,w),b=fx(rx.f+rx.hi/1000,w);
  const da=Math.abs(x-a),db=Math.abs(x-b);if(Math.min(da,db)>7)return null;return da<=db?'lo':'hi'};
 c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);const x=px(e);
  drag={x0:x,a0:view.a,s:view.b-view.a,moved:false,edge:edgeAt(x)}});
 c.addEventListener('pointermove',e=>{const x=px(e),w=c.clientWidth;
  $('hov').textContent='cursor '+xf(x,w).toFixed(3)+' MHz';
  if(!drag){c.style.cursor=edgeAt(x)?'col-resize':'crosshair';return}
  if(drag.edge){drag.moved=true;setEdge(drag.edge,xf(x,w));return}
  if(Math.abs(x-drag.x0)>4)drag.moved=true;
  if(drag.moved){c.style.cursor='grabbing';setView(drag.a0-(x-drag.x0)/w*drag.s,drag.a0-(x-drag.x0)/w*drag.s+drag.s)}});
 const end=e=>{if(!drag)return;if(!drag.moved&&!drag.edge)tune(xf(px(e),c.clientWidth));drag=null;c.style.cursor='crosshair'};
 c.addEventListener('pointerup',end);c.addEventListener('pointercancel',()=>{drag=null});
 c.addEventListener('wheel',e=>{e.preventDefault();const w=c.clientWidth,x=px(e),fp=xf(x,w),s=view.b-view.a;
  const ns=clamp(s*Math.exp(e.deltaY*.0015),MINSPAN,MAXF),fr=x/w;const a=clamp(fp-fr*ns,0,MAXF-ns);view.a=a;view.b=a+ns},{passive:false});
});

/* ---------- Controls ---------- */
Object.keys(MODES).forEach(m=>{const b=document.createElement('button');b.textContent=m;b.onclick=()=>setMode(m);$('modes').appendChild(b)});
BANDS.forEach(([n,a,b,f])=>{const B=document.createElement('button');B.textContent=n;Object.assign(B.dataset,{a,b,f});
 B.onclick=()=>{setView(a-.02*(b-a),b+.02*(b-a));setMode(f<10?'LSB':'USB');tune(f)};$('bands').appendChild(B)});
const full=document.createElement('button');full.textContent='Full 0–30 MHz';full.style.gridColumn='span 4';full.onclick=()=>setView(0,MAXF);$('bands').appendChild(full);
const step=()=>+$('stp').value/1000;
$('up').onclick=()=>tune(rx.f+step(),true);$('dn').onclick=()=>tune(rx.f-step(),true);
$('fin').addEventListener('change',e=>{const v=parseFloat(e.target.value);if(isFinite(v))tune(v/1000,true);e.target.blur();ui()});
$('fin').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
$('run').onclick=()=>{rx.run=!rx.run;const b=$('run');b.textContent=rx.run?'Stop':'Start';b.className=rx.run?'on':'off';applyAudio()};
$('mute').onclick=()=>{rx.mute=!rx.mute;$('mute').setAttribute('aria-pressed',rx.mute);initAudio();applyAudio()};
$('vol').oninput=e=>{rx.vol=e.target.value/100;initAudio();applyAudio()};

/* ---------- Audio (simulated: noise plus a tone when a signal is in the passband) ---------- */
let ac,noiseG,toneG,filt,master,osc;
function initAudio(){
 if(ac){if(ac.state==='suspended')ac.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{ac=new AC();const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;
  filt=ac.createBiquadFilter();filt.type='bandpass';noiseG=ac.createGain();toneG=ac.createGain();master=ac.createGain();
  osc=ac.createOscillator();ns.connect(noiseG);noiseG.connect(filt);osc.connect(toneG);toneG.connect(filt);filt.connect(master);master.connect(ac.destination);
  ns.start();osc.start();applyAudio()}catch(e){ac=null}}
function applyAudio(){
 if(!ac)return;master.gain.value=(rx.mute||!rx.run)?0:rx.vol*rx.vol;
 const cw=rx.mode==='CW';filt.frequency.value=cw?600:1500;filt.Q.value=cw?8:.5;osc.frequency.value=cw?600:440}
document.addEventListener('pointerdown',()=>{if(rx.run)initAudio()},{once:true});

/* ---------- Main loop ---------- */
const S9=-73;
function sUnits(d){if(d<=S9){const s=clamp(Math.round((d+127)/6)+1,1,9);return'S'+s}return'S9+'+Math.round(d-S9)}
function barPos(d){return d<=S9?clamp((d+127)/54,0,1)*.6:.6+clamp((d-S9)/60,0,1)*.4}
let last=0;
function loop(ms){
 if(rx.run&&ms-last>=80){last=ms;const fr=source.frame(ms/1000);if(fr)push(fr);
  if(ac&&source!==simSource){noiseG.gain.value=0;toneG.gain.value=0}else if(ac){const tl=clamp((tonePk+92)/30,0,1),t=ms/1000,cw=rx.mode==='CW';
   const key=cw?(((Math.floor(t*6)*7)%5)<3?1:0):.65+.35*Math.sin(t*9);
   noiseG.gain.value=.25*(1-.6*tl);toneG.gain.value=tl*.35*key}}
 meter+=(Math.max(meterT,-127)-meter)*.2;
 $('sbar').style.width=(barPos(meter)*100).toFixed(1)+'%';
 $('sread').innerHTML=sUnits(meter)+' <span class="dim" style="font-size:12px;font-weight:400">'+Math.round(meter)+' dBm</span>';
 drawSpec();drawAxis();drawWf();requestAnimationFrame(loop)}
function setBadge(){const b=$('src');b.title='';
 if(source===simSource){b.textContent='simulated data';b.className='badge warn'}
 else if(rtlSource.on()){b.textContent='rtl-tcp live';b.className='badge'}
 else{b.textContent='rtl-tcp offline';b.className='badge warn'}}
rtlSource.onstatus=t=>{$('cstat').textContent=t;if(t.startsWith('live')){try{localStorage.setItem('rtl.ws',$('wsurl').value.trim())}catch(e){}}$('conn').textContent=rtlSource.on()?'Disconnect':'Connect';setBadge()};
function useSource(k){
 if(k==='rtl'){source=rtlSource;$('conn').disabled=false}
 else{rtlSource.close();source=simSource;$('conn').disabled=true;$('cstat').textContent='simulated signals'}
 clearWf();setBadge()}
$('srcsel').onchange=e=>useSource(e.target.value);
$('conn').onclick=()=>{rtlSource.on()?rtlSource.close():rtlSource.connect($('wsurl').value.trim())};
let saved='';try{saved=localStorage.getItem('rtl.ws')||''}catch(e){}
$('wsurl').value=new URLSearchParams(location.search).get('ws')||saved||cfg.wsUrl;
setMode('USB');tune(14.2);
$('srcsel').value=cfg.defaultSource;useSource(cfg.defaultSource);
if(cfg.defaultSource==='rtl'&&cfg.autoConnect&&!$('wsurl').value.includes('YOUR-SERVICE'))rtlSource.connect($('wsurl').value.trim());
else if(cfg.defaultSource==='rtl')$('cstat').textContent='Enter your bridge URL, then Connect';
requestAnimationFrame(loop);
</script>
</body>
</html>
